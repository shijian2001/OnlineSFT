[project]
name = "online-sft"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "torch>=2.0",
    "transformers>=4.30.0",
    "pyyaml",
    "datasets",
    "sympy",
    
    # API dependencies
    "aiohttp",
    "openai>=1.0.0",
    
    # Inference
    "vllm>=0.6.0",
    
    # Training framework (auto-installed from GitHub)
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["online_sft"]

