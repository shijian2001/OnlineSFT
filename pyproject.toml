[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "online-sft"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies (aligned with LLaMA-Factory)
    "torch>=2.4.0",
    "transformers>=4.51.0,<=4.57.1,!=4.52.0,!=4.57.0",
    "datasets>=2.16.0,<=4.0.0",
    "pyyaml",
    "sympy",
    
    # API dependencies
    "aiohttp",
    "openai>=1.0.0",
    
    # Inference
    "vllm>=0.6.0,<=0.11.0",
    
    # Training acceleration & optimization
    "deepspeed>=0.10.0,<=0.16.9",
    "liger-kernel>=0.5.5",
    "adam-mini",
    
    # Language processing (Chinese support)
    "nltk",
    "jieba",
    "rouge-chinese",
    
    # Training framework (auto-installed from GitHub)
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipython",
    "pre-commit",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["online_sft"]

[tool.hatch.metadata]
allow-direct-references = true

